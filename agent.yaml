# Disposable agent sandbox. Standalone template: no `base:`, so Lima's
# _default/mounts (which mounts $HOME) is NOT inherited. Verified by verify.sh.
minimumLimaVersion: 2.0.0

# ---- adjustable ----------------------------------------------------------
cpus: 4
memory: 8GiB
disk: 40GiB
# --------------------------------------------------------------------------

vmType: vz
arch: aarch64

images:
# Dated release directory + digest from its SHA256SUMS (release-20261017).
- location: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img
  arch: aarch64
  digest: sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e

user:
  name: lima          # admin user (sudo). Fixed so the host username doesn't leak into the guest.
  home: /home/lima

mounts: []
containerd:
  system: false
  user: false

ssh:
  forwardAgent: false
  loadDotSSHPubKeys: false

# plain: disables mounts, dynamic port forwarding, the guest agent, containerd,
# Rosetta, ssh-agent forwarding and host clock sync; `limactl shell`/`copy` and
# provisioning still work. Trade-off: no host clock sync (timesyncd covers it;
# nftables.conf allows its NTP). See README.
plain: true
portForwards:
- guestPortRange: [1, 65535]
  ignore: true

# Never copy host proxy env vars into the guest.
propagateProxyEnv: false

provision:
- mode: system
  file: provision/10-system.sh
- mode: system
  file: provision/20-egress-install.sh
- mode: system
  file: provision/30-agent-tools.sh
- mode: system
  file: provision/90-client-config.sh
