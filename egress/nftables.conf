#!/usr/sbin/nft -f
# Fail-closed egress lockdown (IPv4 + IPv6). Root-owned, loaded at boot by nftables.service.
#
# Policy by uid:
#   egress                 -> DNS (via the local resolver stub) and TCP 80/443 out
#   everyone else (agent,  -> ONLY tcp to 127.0.0.1:8080 (the proxy). Everything else, including
#   lima admin, root)         DNS, UDP/QUIC, IPv6 and other loopback ports, is rejected + counted.
# A few system daemons are exempted by uid so networking and time keep working.
#
# Dev servers: loopback ports other than 8080 are blocked for the agent (spec). To let tools in
# the VM reach localhost servers, uncomment the "dev-loopback" rule below (it still excludes the
# resolver stub). Reload: sudo nft -f /etc/nftables.conf

table inet egress_fw
delete table inet egress_fw

table inet egress_fw {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    tcp dport 22 accept comment "ssh for limactl"
    udp sport 67 udp dport 68 accept comment "dhcp"
    udp sport 547 udp dport 546 accept comment "dhcpv6"
    icmp type { echo-request, destination-unreachable, time-exceeded } accept
    icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, echo-request,
                  nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
  }

  chain output {
    type filter hook output priority filter; policy drop;
    # sshd replies (also covers sessions that predate conntrack tracking when the table first loads)
    tcp sport 22 accept comment "ssh for limactl"
    ct state established,related accept
    ct state invalid drop

    icmpv6 type { nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert } accept

    # system daemons (not users of the proxy)
    meta skuid "systemd-network"  udp sport 68  udp dport 67  accept
    meta skuid "systemd-network"  udp sport 546 udp dport 547 accept
    meta skuid "systemd-timesync" udp dport 123 accept
    meta skuid "systemd-resolve"  udp dport 53 accept
    meta skuid "systemd-resolve"  tcp dport 53 accept

    # the only loopback port anyone may use
    oif "lo" ip daddr 127.0.0.1 tcp dport 8080 accept

    # dev-loopback (disabled by default): other loopback traffic except the resolver stubs
    # oif "lo" ip daddr != { 127.0.0.53, 127.0.0.54 } accept

    # the proxy process: name resolution through the local stub, then web ports
    oif "lo" meta skuid "egress" ip daddr { 127.0.0.53, 127.0.0.54 } th dport 53 accept
    meta skuid "egress" tcp dport { 80, 443 } accept

    limit rate 10/minute burst 5 packets log prefix "egress-fw-drop: " level info
    meta l4proto tcp counter reject with tcp reset
    counter reject with icmpx type admin-prohibited
  }
}
